<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title description">
  <title id="title">Three levels of government in India</title>
  <desc id="description">Union government, State government, and Local government are arranged as three levels.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="900" height="430" rx="24" fill="#f8fafc" />
  <text x="450" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Three levels of government</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="250" y="92" width="400" height="76" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
    <text x="450" y="125" font-size="20" font-weight="700" fill="#1e3a8a">Union Government</text>
    <text x="450" y="149" font-size="14" fill="#334155">National matters</text>
    <path d="M450 172 L450 209" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="250" y="220" width="400" height="76" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
    <text x="450" y="253" font-size="20" font-weight="700" fill="#166534">State Government</text>
    <text x="450" y="277" font-size="14" fill="#334155">State and regional matters</text>
    <path d="M450 300 L450 337" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)" />
    <rect x="250" y="348" width="400" height="62" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="2" />
    <text x="450" y="386" font-size="20" font-weight="700" fill="#9a3412">Local Government</text>
  </g>
</svg>
